<!DOCTYPE html>
<html lang="en">
<head>
<script>
// AUTO-UNLOCK after Selar payment - Emmanuel fix
(function(){
  try {
    var params = new URLSearchParams(window.location.search);
    var paid = params.get('paid');
    if(paid){
      // Normalize values
      var map = {
        'monthly': 'monthly',
        '12k': 'monthly',
        '100000': 'monthly',
        '300k': 'monthly',
        '300k_monthly': 'monthly',
        'yearly': 'yearly',
        '50k': 'yearly',
        'forever': 'lifetime',
        '300k': 'lifetime',
        'lifetime': 'lifetime',
        'true': 'premium',
        '1': 'premium'
      };
      var plan = map[paid.toLowerCase()] || 'premium';
      localStorage.setItem('nexa_paid','true');
      localStorage.setItem('nexa_clicked_pay','true');
      localStorage.setItem('nexa_plan_type', plan);
      localStorage.setItem('nexa_plan', JSON.stringify({type: plan, active: true, paidAt: new Date().toISOString()}));
      // Clean URL and show success
      var cleanUrl = window.location.origin + window.location.pathname;
      window.history.replaceState({}, document.title, cleanUrl);
      console.log('Nexa auto-unlocked:', plan);
      setTimeout(function(){
        var el = document.createElement('div');
        el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:12px 24px;border-radius:9999px;z-index:99999;font-weight:bold;box-shadow:0 10px 30px rgba(0,0,0,0.2)';
        el.textContent='✅ Payment confirmed! Nexa unlocked — '+plan.toUpperCase();
        document.body.appendChild(el);
        setTimeout(function(){el.remove()},4000);
      },800);
    }
  } catch(e){console.log('auto-unlock error', e)}
})();
</script>

<script>
// AUTO-LOCK when subscription expires - Emmanuel fix
(function(){
  try {
    function checkExpiry(){
      var paid = localStorage.getItem('nexa_paid');
      if(paid !== 'true') return; // already locked
      
      var planType = (localStorage.getItem('nexa_plan_type') || '').toLowerCase();
      var planJson = null;
      try { planJson = JSON.parse(localStorage.getItem('nexa_plan') || 'null'); } catch(e){}
      
      var paidAtStr = null;
      if(planJson && planJson.paidAt) paidAtStr = planJson.paidAt;
      else if(planJson && planJson.startDate) paidAtStr = planJson.startDate;
      // fallback: check nexa_plan_paidAt key
      else paidAtStr = localStorage.getItem('nexa_paid_at') || localStorage.getItem('nexa_plan_paidAt');
      
      if(!paidAtStr) {
        // If no date, set now as start (for old users)
        var nowIso = new Date().toISOString();
        localStorage.setItem('nexa_paid_at', nowIso);
        if(planJson){ planJson.paidAt = nowIso; localStorage.setItem('nexa_plan', JSON.stringify(planJson)); }
        return;
      }
      
      var paidAt = new Date(paidAtStr);
      var now = new Date();
      var diffDays = Math.floor((now - paidAt) / (1000*60*60*24));
      
      var expiryDays = null;
      var planName = '';
      if(planType.includes('monthly') || planType === 'month' || planType === '12k'){
        expiryDays = 30; planName = 'Monthly (₦100k)';
      } else if(planType.includes('yearly') || planType === 'year' || planType === '50k'){
        expiryDays = 365; planName = 'Yearly (₦800k)';
      } else if(planType.includes('lifetime') || planType.includes('forever') || planType === '300k' || planType === '3.5m' || planType === '3500000' || planType === 'premium'){
        expiryDays = null; // never expires, except if premium without type = treat as lifetime
        // Check if it's actually lifetime
        if(planType === 'premium'){
          // Try to detect from original plan type stored
          var raw = (localStorage.getItem('nexa_plan_type') || '').toLowerCase();
          // premium alone means forever in old code, so don't expire
          return;
        }
        return;
      } else if(planType.includes('free') || planType === 'free'){
        expiryDays = 3; planName = 'Free Trial';
      }
      
      if(expiryDays !== null && diffDays >= expiryDays){
        // EXPIRED - LOCK IT
        console.log('Nexa plan expired:', planType, diffDays, 'days');
        localStorage.removeItem('nexa_paid');
        localStorage.setItem('nexa_expired','true');
        localStorage.setItem('nexa_expired_plan', planName);
        localStorage.setItem('nexa_expired_days', diffDays.toString());
        // Force reload to show paywall
        setTimeout(function(){
          var banner = document.createElement('div');
          banner.style.cssText='position:fixed;top:0;left:0;right:0;background:#ef4444;color:white;padding:14px 20px;z-index:999999;text-align:center;font-weight:bold;font-family:system-ui;';
          banner.innerHTML='⏰ Your '+planName+' plan expired after '+expiryDays+' days ('+diffDays+' days ago). Please renew to continue using Nexa. <a href="#pay" style="color:white;text-decoration:underline;margin-left:8px;">Renew Now →</a>';
          document.body.prepend(banner);
          // If app has paywall state, try to trigger it
          try { localStorage.setItem('nexa_show_paywall','true'); } catch(e){}
          setTimeout(function(){ window.location.reload(); }, 2000);
        }, 1000);
      } else if(expiryDays !== null){
        var daysLeft = expiryDays - diffDays;
        console.log('Nexa plan active:', planName, daysLeft+' days left');
        // Show warning if 3 days or less left
        if(daysLeft <= 3 && daysLeft >=0){
          setTimeout(function(){
            var warn = document.createElement('div');
            warn.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f59e0b;color:white;padding:10px 20px;border-radius:9999px;z-index:99999;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.2);font-family:system-ui;font-size:14px;';
            warn.textContent='⚠️ Your '+planName+' expires in '+daysLeft+' day'+(daysLeft===1?'':'s')+' — Renew to keep access';
            document.body.appendChild(warn);
            setTimeout(function(){warn.remove()},6000);
          },1500);
        }
      }
    }
    // Run on load
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', checkExpiry);
    } else {
      checkExpiry();
    }
    // Also check every 1 hour while app open
    setInterval(checkExpiry, 60*60*1000);
  } catch(e){ console.log('expiry check error', e); }
})();
</script>
